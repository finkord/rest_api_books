services:
  mock-server:
    image: stoplight/prism:5
    # Mount the local OpenAPI specification into the container
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    # Start the Prism mock server, binding to 0.0.0.0 so it is accessible outside the container
    command: mock -h 0.0.0.0 -m false /openapi.yaml
    # Expose port 4010 for API testing
    ports:
      - "4010:4010"
