# name: books
services:

  app:
    build: .
    image: finkord/books-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./app:/code/app
    networks:
      - books_network

  mongodb:
    image: mongo:4.2.3-bionic
    restart: unless-stopped
    ports:
      - 27017:27017
    env_file:
      - .env
    volumes:
      - ./mongo-entrypoint:/docker-entrypoint-initdb.d
      - ./data/mongo:/data/db
      - ./configs/mongoconfig:/data/configdb
    networks:
      - books_network

networks:
  books_network:
    driver: bridge
