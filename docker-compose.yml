# name: books
services:

  app:
    build: .
    image: finkord/books-api:lab2_b11dc11
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./app:/code/app
    networks:
      - books_network

  mongodb_cnu:
    image: mongo:latest
    container_name: mongodb_cnu
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - books_network

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/psql:/var/lib/postgresql/data
      - ./configs/psql/:/docker-entrypoint-initdb.d
    networks:
      - books_network

networks:
  books_network:
    driver: bridge
