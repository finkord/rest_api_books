services:
  mock-server:
    image: stoplight/prism:5
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    command: mock -h 0.0.0.0 --multiprocess=false /openapi.yaml
    ports:
      - "4010:4010"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://localhost:8000
    depends_on:
      - mock-server

  app:
    build: .
    image: finkord/books-api:lab7_a0daed9
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    environment:
      - RATE_LIMITER_ENABLED=False
    volumes:
      - ./app:/code/app
    networks:
      - books_network

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - books_network

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/psql:/var/lib/postgresql/data
      - ./configs/psql/:/docker-entrypoint-initdb.d
    networks:
      - books_network

  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host=http://app:8000
    depends_on:
      - app
    networks:
      - books_network

networks:
  books_network:
    driver: bridge
