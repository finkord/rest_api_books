openapi: 3.0.3
info:
  title: Library Management API
  version: 1.0.0
  description: Mock API for FastAPI Library Management
paths:
  /api/books:
    get:
      summary: Get paginated list of books
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [available, borrowed]
        - name: author
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated response of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookResponse'
              examples:
                paginatedBooks:
                  summary: Realistic paginated list
                  value:
                    items:
                      - id: "123e4567-e89b-12d3-a456-426614174000"
                        title: "The Go Programming Language"
                        author: "Alan A. A. Donovan"
                        description: "An authoritative resource for any programmer who wants to learn Go."
                        status: "available"
                        year_published: 2015
                      - id: "123e4567-e89b-12d3-a456-426614174001"
                        title: "Clean Code"
                        author: "Robert C. Martin"
                        description: "A Handbook of Agile Software Craftsmanship."
                        status: "borrowed"
                        year_published: 2008
                    total: 2
                    limit: 10
                    offset: 0
                    next_page: null
                    prev_page: null
    post:
      summary: Create multiple books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BookRequest'
            examples:
              bulkCreateRequest:
                summary: Request to create multiple books
                value:
                  - title: "The Pragmatic Programmer"
                    author: "David Thomas"
                    description: "Journey to mastery."
                    status: "available"
                    year_published: 1999
      responses:
        '201':
          description: Books successfully created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
              examples:
                bulkCreateResponse:
                  summary: Realistic created books response
                  value:
                    - id: "123e4567-e89b-12d3-a456-426614174002"
                      title: "The Pragmatic Programmer"
                      author: "David Thomas"
                      description: "Journey to mastery."
                      status: "available"
                      year_published: 1999

  /api/books/{book_id}:
    get:
      summary: Get a specific book by ID
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
              examples:
                singleBook:
                  summary: Realistic single book
                  value:
                    id: "123e4567-e89b-12d3-a456-426614174000"
                    title: "The Go Programming Language"
                    author: "Alan A. A. Donovan"
                    description: "An authoritative resource for any programmer who wants to learn Go."
                    status: "available"
                    year_published: 2015

components:
  schemas:
    BookRequest:
      type: object
      required:
        - title
        - author
        - description
        - status
        - year_published
      properties:
        title:
          type: string
        author:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [available, borrowed]
        year_published:
          type: integer
    BookResponse:
      type: object
      required:
        - id
        - title
        - author
        - description
        - status
        - year_published
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        description:
          type: string
        status:
          type: string
        year_published:
          type: integer
    PaginatedBookResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_page:
          type: string
          nullable: true
        prev_page:
          type: string
          nullable: true