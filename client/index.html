<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/@sakun/system.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Auth Section -->
  <div id="auth-section" class="window" style="width: 300px; margin: 100px auto; display: none;">
    <div class="title-bar">
      <h1 class="title">Authentication</h1>
    </div>
    <div class="window-pane">
      <form id="auth-form" class="standard-form">
        <div class="field-row">
          <label for="username">Username:</label>
          <input type="text" id="username" required>
        </div>
        <div class="field-row">
          <label for="password">Password:</label>
          <input type="password" id="password" required>
        </div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
          <button type="submit" class="btn">Login</button>
          <button type="button" id="register-btn" class="btn">Register</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard-section" style="display: none; padding: 20px;">
    
    <div class="window" style="margin-bottom: 20px; width: 100%;">
      <div class="title-bar">
        <h1 class="title">Control Panel</h1>
      </div>
      <div class="window-pane" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <input type="text" id="filter-author" placeholder="Author...">
        <select id="filter-status">
          <option value="">Any Status</option>
          <option value="available">Available</option>
          <option value="borrowed">Borrowed</option>
        </select>
        <select id="filter-sort">
          <option value="">Sort By...</option>
          <option value="title">Title</option>
          <option value="year_published">Year</option>
        </select>
        <select id="filter-order">
          <option value="asc">Asc</option>
          <option value="desc">Desc</option>
        </select>
        <button id="apply-filters-btn" class="btn">Apply</button>
        <button id="logout-btn" class="btn" style="margin-left: auto;">Logout</button>
      </div>
    </div>

    <div style="display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;">
      <div class="window" style="flex: 1; min-width: 300px;">
        <div class="title-bar">
          <h1 class="title">Books Directory</h1>
        </div>
        <div class="window-pane">
          <div id="loader" style="display: none; margin-bottom: 10px;">Loading...</div>
          <div id="books-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px;"></div>
          <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
            <button id="prev-btn" class="btn" disabled>Prev</button>
            <button id="next-btn" class="btn" disabled>Next</button>
          </div>
        </div>
      </div>

      <div class="window" style="width: 300px;">
        <div class="title-bar">
          <h1 class="title">Add Book</h1>
        </div>
        <div class="window-pane">
          <form id="add-book-form" class="standard-form">
            <div class="field-row">
              <label for="title">Title:</label>
              <input type="text" id="title" required>
            </div>
            <div class="field-row">
              <label for="author">Author:</label>
              <input type="text" id="author" required>
            </div>
            <div class="field-row">
              <label for="description">Desc:</label>
              <input type="text" id="description" required>
            </div>
            <div class="field-row">
              <label for="status">Status:</label>
              <select id="status" required>
                <option value="available">Available</option>
                <option value="borrowed">Borrowed</option>
              </select>
            </div>
            <div class="field-row">
              <label for="year">Year:</label>
              <input type="number" id="year" required>
            </div>
            <button type="submit" id="submit-btn" class="btn" style="margin-top: 15px; width: 100%;">Create</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="window" style="position: fixed; bottom: 20px; right: 20px; display: none; z-index: 1000; width: 250px;">
    <div class="title-bar">
      <h1 class="title">Alert</h1>
    </div>
    <div class="window-pane" id="toast-message" style="text-align: center;">
      Action successful!
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
