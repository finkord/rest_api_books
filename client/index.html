<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-200">
    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">L</div>
                    <span class="text-xl font-bold tracking-tight">Library<span class="text-indigo-600 dark:text-indigo-400">Pro</span></span>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- Theme Toggle -->
                    <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle Dark Mode">
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    </button>
                    <!-- Retro Toggle -->
                    <button onclick="window.location.href='index_retro.html'" class="px-3 py-1.5 text-xs font-bold rounded bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200 hover:bg-yellow-200 dark:hover:bg-yellow-800 transition-colors">Retro UI</button>

                    <div id="nav-actions" class="hidden flex items-center gap-4 border-l border-slate-200 dark:border-slate-700 pl-4 ml-2">
                        <span id="user-display" class="text-sm font-medium text-slate-500 dark:text-slate-400"></span>
                        <button id="logout-btn" class="text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Auth Section -->
    <div id="auth-section" class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl shadow-slate-200 dark:shadow-none w-full max-w-md border border-slate-100 dark:border-slate-700 transition-colors duration-200">
            <h2 class="text-2xl font-bold mb-2 text-center text-slate-900 dark:text-white">Welcome Back</h2>
            <p class="text-slate-500 dark:text-slate-400 text-center mb-8">Manage your library collection with ease.</p>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-300" for="username">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700 dark:text-slate-300" for="password">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div class="pt-2 flex flex-col gap-3">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200 dark:shadow-none">Login</button>
                    <button type="button" id="register-btn" class="w-full bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <main id="dashboard-section" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Sidebar -->
            <aside class="w-full lg:w-80 space-y-6">
                <!-- Filters -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-200">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2 dark:text-white">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                        Filters
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1 block">Author</label>
                            <input type="text" id="filter-author" placeholder="Search author..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1 block">Status</label>
                            <select id="filter-status" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white outline-none focus:border-indigo-500">
                                <option value="">All Statuses</option>
                                <option value="available">Available</option>
                                <option value="borrowed">Borrowed</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1 block">Sort By</label>
                                <select id="filter-sort" class="w-full px-2 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white outline-none">
                                    <option value="title">Title</option>
                                    <option value="year_published">Year</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1 block">Order</label>
                                <select id="filter-order" class="w-full px-2 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white outline-none">
                                    <option value="asc">Asc</option>
                                    <option value="desc">Desc</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1 block">Page Size</label>
                            <select id="filter-limit" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white outline-none">
                                <option value="6">6 per page</option>
                                <option value="12" selected>12 per page</option>
                                <option value="24">24 per page</option>
                                <option value="48">48 per page</option>
                            </select>
                        </div>
                        <button id="apply-filters-btn" class="w-full bg-slate-900 dark:bg-indigo-600 text-white text-sm font-bold py-2 rounded-lg hover:bg-slate-800 dark:hover:bg-indigo-700 transition-colors">Apply Filters</button>
                    </div>
                </div>

                <!-- Add Book Form -->
                <div class="bg-indigo-600 dark:bg-slate-800 p-6 rounded-xl text-white shadow-lg shadow-indigo-100 dark:shadow-none dark:border dark:border-slate-700 transition-colors duration-200">
                    <h3 class="text-lg font-bold mb-4">Add New Book</h3>
                    <form id="add-book-form" class="space-y-3">
                        <input type="text" id="title" placeholder="Title" required class="w-full px-3 py-2 text-sm rounded-lg bg-indigo-500/50 dark:bg-slate-700 border border-indigo-400 dark:border-slate-600 placeholder:text-indigo-200 dark:placeholder-slate-400 outline-none focus:bg-white dark:focus:bg-slate-600 focus:text-slate-900 dark:focus:text-white">
                        <input type="text" id="author" placeholder="Author" required class="w-full px-3 py-2 text-sm rounded-lg bg-indigo-500/50 dark:bg-slate-700 border border-indigo-400 dark:border-slate-600 placeholder:text-indigo-200 dark:placeholder-slate-400 outline-none focus:bg-white dark:focus:bg-slate-600 focus:text-slate-900 dark:focus:text-white">
                        <textarea id="description" placeholder="Description" required rows="2" class="w-full px-3 py-2 text-sm rounded-lg bg-indigo-500/50 dark:bg-slate-700 border border-indigo-400 dark:border-slate-600 placeholder:text-indigo-200 dark:placeholder-slate-400 outline-none focus:bg-white dark:focus:bg-slate-600 focus:text-slate-900 dark:focus:text-white"></textarea>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="status" required class="px-3 py-2 text-sm rounded-lg bg-indigo-500/50 dark:bg-slate-700 border border-indigo-400 dark:border-slate-600 outline-none focus:bg-white dark:focus:bg-slate-600 focus:text-slate-900 dark:focus:text-white">
                                <option value="available" class="dark:bg-slate-700">Available</option>
                                <option value="borrowed" class="dark:bg-slate-700">Borrowed</option>
                            </select>
                            <input type="number" id="year" placeholder="Year" required class="px-3 py-2 text-sm rounded-lg bg-indigo-500/50 dark:bg-slate-700 border border-indigo-400 dark:border-slate-600 placeholder:text-indigo-200 dark:placeholder-slate-400 outline-none focus:bg-white dark:focus:bg-slate-600 focus:text-slate-900 dark:focus:text-white">
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-white dark:bg-indigo-500 text-indigo-600 dark:text-white font-bold py-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-600 transition-colors mt-2">Create Book</button>
                    </form>
                </div>
            </aside>

            <!-- Book Grid -->
            <section class="flex-1">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Book Collection</h2>
                    <span id="page-info" class="text-sm font-medium text-slate-500 dark:text-slate-400"></span>
                </div>
                
                <div id="loader" class="hidden py-20 text-center">
                    <div class="inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="mt-4 text-slate-500 dark:text-slate-400 font-medium">Fetching books...</p>
                </div>

                <div id="books-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Books dynamically injected here -->
                </div>

                <!-- Pagination -->
                <div class="mt-12 flex justify-center items-center gap-4">
                    <button id="prev-btn" disabled class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:hover:bg-white dark:disabled:hover:bg-slate-800 transition-all">Previous</button>
                    <button id="next-btn" disabled class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:hover:bg-white dark:disabled:hover:bg-slate-800 transition-all">Next</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 right-8 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <span id="toast-icon"></span>
            <span id="toast-message" class="font-medium"></span>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    
    <script>
        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            }
        }

        // On load
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        updateIcons();

        // On toggle
        themeToggleBtn.addEventListener('click', function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
            updateIcons();
        });
    </script>
</body>
</html>
